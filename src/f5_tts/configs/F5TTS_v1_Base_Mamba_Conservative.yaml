hydra:
  run:
    dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: Emilia_ZH_EN
  batch_size_per_gpu: 38400
  batch_size_type: frame
  max_samples: 64
  num_workers: 16

optim:
  epochs: 11
  learning_rate: 7.5e-5
  weight_decay: 0.01
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: auto
  bnb_optimizer: False

model:
  name: F5TTS_v1_Base_Mamba_Conservative
  tokenizer: pinyin
  tokenizer_path: null
  backbone: DiT
  arch:
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: True
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: False
    checkpoint_activations: True
    mamba_block_ids: [11, 14]
    mamba_bidirectional: True
    mamba_d_state: 64
    mamba_d_conv: 4
    mamba_expand: 1
    mamba_alpha_init: 0.02
    mamba_output_scale_init: 1.0e-3
  distill:
    enabled: True
    hidden_weight: 0.02
    output_weight: 0.05
    hidden_layers: [11, 14, 21]
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos
  vocoder:
    is_local: False
    local_path: null

ckpts:
  logger: wandb
  wandb_project: CFM-TTS
  wandb_run_name: ${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}
  wandb_resume_id: null
  log_samples: True
  save_per_updates: 50000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  teacher_checkpoint: hf://SWivid/F5-TTS/F5TTS_v1_Base/model_1250000.safetensors
  student_init_checkpoint: hf://SWivid/F5-TTS/F5TTS_v1_Base/model_1250000.safetensors
  load_ema_teacher: True
  load_ema_student_init: True
  save_dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}
